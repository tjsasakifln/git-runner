name: Build listed n8n JSON ZIP

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - 'tmp/n8n-json-export-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install downloader
        run: python -m pip install --disable-pip-version-check gdown

      - name: Merge and verify spreadsheet index
        run: |
          python - <<'PY'
          import glob
          import hashlib
          import json
          from pathlib import Path

          rows = []
          for path in sorted(glob.glob('tools/input/part-*.json')):
              with open(path, encoding='utf-8') as f:
                  rows.extend(json.load(f))

          bad = 'https://drive.google.com/file/d/1pbHvDIEz6WXkZK4dqOeSN4JlP_ZCAB3H5/view?usp=drive_link'
          good = 'https://drive.google.com/file/d/1pbHvDIEz6WXkZ4dqOeSN4JlP_ZCAB3H5/view?usp=drive_link'
          for row in rows:
              row['template_urls'] = [good if url == bad else url for url in row.get('template_urls', [])]

          url_count = sum(len(row.get('template_urls', [])) for row in rows)
          assert len(rows) == 172, len(rows)
          assert url_count == 311, url_count

          canonical = json.dumps(rows, ensure_ascii=False, sort_keys=True, separators=(',', ':')).encode()
          actual_hash = hashlib.sha256(canonical).hexdigest()
          expected_hash = '82f406fd000c6e6d565ec1fd0d05f9c2ffa0580ef7f74e9389838bc65a476d85'
          assert actual_hash == expected_hash, (actual_hash, expected_hash)

          Path('tools/n8n_templates_input.json').write_text(json.dumps({
              'source': 'n8n Templates.xlsx',
              'row_count': len(rows),
              'drive_url_count': url_count,
              'rows': rows,
          }, ensure_ascii=False, indent=2), encoding='utf-8')
          print(f'Índice validado: {len(rows)} registros, {url_count} links, SHA-256 {actual_hash}')
          PY

      - name: Tune network pass
        run: |
          sed -i 's/range(1, 4)/range(1, 2)/' tools/build_n8n_json_zip.py
          sed -i 's/max_workers=5/max_workers=20/' tools/build_n8n_json_zip.py

      - name: Download, validate and package workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/build_n8n_json_zip_fast.py

      - name: Verify ZIP
        run: |
          python - <<'PY'
          import json
          import zipfile
          from pathlib import Path

          path = Path('tools/n8n-json-listados.zip')
          assert path.exists() and path.stat().st_size > 0
          with zipfile.ZipFile(path) as zf:
              assert zf.testzip() is None
              names = zf.namelist()
              assert 'manifest.json' in names
              manifest = json.loads(zf.read('manifest.json'))
              valid = [m for m in manifest if m.get('json_file')]
              print(f'ZIP íntegro: {len(valid)} arquivos JSON para {len(manifest)} links auditados')
          PY

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: n8n-json-listados
          path: tools/n8n-json-listados.zip
          if-no-files-found: error
          retention-days: 1
